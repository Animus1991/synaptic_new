apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "synapse-learning.fullname" . }}-migrate
  labels:
    {{- include "synapse-learning.labels" . | nindent 4 }}
  annotations:
    # Re-run on each upgrade by changing this value in values or CI.
    helm.sh/hook: pre-upgrade,pre-install
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-5"
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit | default 3 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "synapse-learning.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["npm", "run", "migrate"]
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: {{ .Values.secrets.keys.databaseUrl }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.keys.databaseUrl }}
