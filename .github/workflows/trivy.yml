# Trivy — A1 container / filesystem CVE gate for server image
name: Trivy

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: server
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -f server/Dockerfile -t synapse-learning-api:ci .
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: synapse-learning-api:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
